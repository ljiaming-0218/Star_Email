const W=CONFIG.roomCols*CONFIG.roomW+1,H=CONFIG.roomRows*CONFIG.roomH+1,T=CONFIG.tile;

let touch={id:null,x:0,y:0,sprint:false,crouch:false},pointerActions=new Map();
function rand(g){g.seed=(Math.imul(g.seed,1664525)+1013904223)>>>0;return g.seed/4294967296}
function choose(g,a){return a[Math.floor(rand(g)*a.length)]}

function neighbors(i){let x=i%CONFIG.roomCols,y=Math.floor(i/CONFIG.roomCols),a=[];if(x>0)a.push(i-1);if(x<CONFIG.roomCols-1)a.push(i+1);if(y>0)a.push(i-CONFIG.roomCols);if(y<CONFIG.roomRows-1)a.push(i+CONFIG.roomCols);return a}

function makeGame(){

function bestRead(level=difficulty){try{let n=Number(localStorage.getItem(level===1?CONFIG.saveKey:CONFIG.saveKey+'_'+level));return Number.isFinite(n)&&n>0?n:null}catch(e){return null}}
function bestSave(n,level=difficulty){try{let b=bestRead(level);if(!b||n<b)localStorage.setItem(level===1?CONFIG.saveKey:CONFIG.saveKey+'_'+level,String(n))}catch(e){}}
function sound(type,frequency){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let now=audio.currentTime,o=audio.createOscillator(),v=audio.createGain(),freq=frequency||({step:95,beep:550,alarm:580,heart:75,zap:1000,boom:65,card:700,decoy:420}[type]||400);o.type=type==='boom'?'sawtooth':type==='step'||type==='heart'?'sine':'square';o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*(type==='alarm'?1.35:.5)),now+(type==='boom'?.8:.13));v.gain.setValueAtTime(type==='boom'?.08:.025,now);v.gain.exponentialRampToValueAtTime(.0001,now+(type==='boom'?1:.15));o.connect(v);v.connect(audio.destination);o.start(now);o.stop(now+(type==='boom'?1:.16))}catch(e){}}
// A low, procedural reactor hum builds with danger and obeys the same mute control as effects.
function updateAmbient(dt){
  ambientClock-=dt;if(ambientClock>0)return;ambientClock=.25;
  if(!audio)return;
  if(!ambient){try{let gain=audio.createGain(),low=audio.createOscillator(),high=audio.createOscillator();gain.gain.value=0;low.type='sine';low.frequency.value=54;high.type='triangle';high.frequency.value=81;low.connect(gain);high.connect(gain);gain.connect(audio.destination);low.start();high.start();ambient={gain,low,high}}catch(e){return}}
  let active=screen==='play'&&game&&!game.paused&&!muted;
  let tension=active&&(game.time<=CONFIG.lateAlarm||game.robots.some(r=>r.state==='chase')||game.hunters.some(h=>h.awake&&dist(h,game.player)<300));

  ambient.high.frequency.setTargetAtTime(tension?87:81,audio.currentTime,.5);
}
function msg(g,s,t=2.5){g.message=s;g.messageTime=t}
function burst(g,x,y,color,n=12){for(let i=0;i<n;i++){let a=rand(g)*Math.PI*2,s=30+rand(g)*100;g.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+rand(g)*.6,color})}}
function alertNoise(g,source,range){for(const r of g.robots){if(r.state==='chase'||dist(r,source)>range||r.heardCooldown>0)continue;r.state='suspicious';r.target={x:source.x,y:source.y};r.search=CONFIG.searchTime;r.repath=0;r.heardCooldown=CONFIG.hearCooldown}}

function decoy(){if(screen!=='play'||game.action||game.player.decoyLock>0)return;let g=game,p=g.player,d=36,tx=p.x+Math.cos(p.facing)*d,ty=p.y+Math.sin(p.facing)*d;if(!canStand(g,tx,ty,4)){tx=p.x;ty=p.y}g.decoys.push({x:tx,y:ty,life:CONFIG.decoyDuration,pulse:0});p.decoyLock=CONFIG.decoyCooldown;sound('decoy');msg(g,'诱饵已投放：机器人会被声音吸引',1.8)}
function nearestInteraction(g){let p=g.player,items=[];for(const c of g.cards)if(!c.taken)items.push({type:'card',object:c,label:'E  拿取密钥卡'});if(!g.gateOpen)items.push({type:'gate',object:g.gate,label:g.found===3?'E  解锁中央闸门':'中央闸门 · 需要 3 张密钥卡'});items.push({type:'panel',object:g.panel,label:'E  切断附近激光（2 秒）'});if(!g.terminalUsed)items.push({type:'terminal',object:g.terminal,label:'E  入侵安保终端（2 秒）'});if(g.gateOpen)items.push({type:'exit',object:g.exit,label:'E  进入逃生舱'});return items.filter(i=>dist(p,i.object)<CONFIG.interactionRange).sort((a,b)=>dist(p,a.object)-dist(p,b.object))[0]}
function interact(){if(screen!=='play'||game.action)return;let g=game,i=nearestInteraction(g);if(!i){msg(g,'附近没有可交互的物体',1);return}if(i.type==='card'){i.object.taken=true;g.found++;sound('card');burst(g,i.object.x,i.object.y,'#83f2d4');msg(g,`密钥卡 ${g.found}/3 ${g.found===3?'· 前往中央闸门':''}`)}else if(i.type==='gate'){if(g.found<3){msg(g,'还需要 '+(3-g.found)+' 张密钥卡');return}g.gateOpen=true;sound('card');msg(g,'中央闸门已解锁！前往逃生舱',4)}else if(i.type==='panel'){g.action={kind:'panel',time:CONFIG.panelTime};sound('beep')}else if(i.type==='terminal'){g.action={kind:'terminal',time:2,total:2};sound('beep')}else if(i.type==='exit'){g.action={kind:'extract',time:3,total:3};sound('alarm');msg(g,'逃生舱启动中，坚守 3 秒！',3)}}
function pathMove(g,e,target,speed,dt){if(!target)return;e.repath-=dt;if(e.repath<=0){e.repath=CONFIG.pathRefresh;e.path=pathTo(g,e,target)}let next=e.path[0];if(!next){if(visible(g,e,target))next=target;else return}let dx=next.x-e.x,dy=next.y-e.y,d=Math.hypot(dx,dy);if(d<4){e.path.shift();return}e.angle=Math.atan2(dy,dx);let step=Math.min(d,speed*dt);move(g,e,dx/d*step,dy/d*step)}
function updateRobot(g,r,dt){if(g.empTime>0)return;let p=g.player;r.heardCooldown=Math.max(0,r.heardCooldown-dt);let dx=p.x-r.x,dy=p.y-r.y,d=Math.hypot(dx,dy),angle=Math.atan2(dy,dx),delta=Math.atan2(Math.sin(angle-r.angle),Math.cos(angle-r.angle));let sees=d<CONFIG.visionRange&&Math.abs(delta)<CONFIG.visionAngle*Math.PI/360&&visible(g,r,p);
  if(sees){let stealth=(keys.c||touch.crouch)?CONFIG.crouchVisibility:1;r.awareness=clamp(r.awareness+CONFIG.discoveryRate*dt*stealth,0,1);r.lost=0;if(r.awareness>=1&&r.state!=='chase'){r.state='chase';g.detections++;sound('alarm');msg(g,'被发现了！寻找墙壁遮挡视线',2)}}else{r.awareness=Math.max(0,r.awareness-CONFIG.discoveryDecay*dt);if(r.state==='chase'){r.lost+=dt;if(r.lost>CONFIG.loseSightDelay){r.state='search';r.search=CONFIG.searchTime;r.target={x:p.x,y:p.y};r.repath=0}}}

function updateHunter(g,h,dt,index){if(g.elapsed<g.difficultyInfo.hunterWake)return;if(!h.awake){h.awake=true;burst(g,h.x,h.y,'#ff5450');msg(g,'猎杀者已苏醒！它们正在追踪你的足迹',4);sound('alarm')}

function updateGame(dt){let g=game;if(!g||g.ended)return;g.elapsed+=dt;g.time=Math.max(0,g.time-dt);g.messageTime=Math.max(0,g.messageTime-dt);if(!g.hunterWarned&&g.elapsed>=g.difficultyInfo.hunterWake-5){g.hunterWarned=true;sound('alarm');msg(g,'警告：猎杀者即将苏醒',3)}if(g.time<=0){finish(false,'反应堆熔毁');return}let p=g.player;p.lock=Math.max(0,p.lock-dt);p.decoyLock=Math.max(0,(p.decoyLock||0)-dt);for(const l of g.lasers)l.disabled=Math.max(0,l.disabled-dt);g.empTime=Math.max(0,g.empTime-dt);

function drawResult(){drawBackground();let g=game;text(g.win?'逃生成功':'任务失败',480,105,38,g.win?'#a2f3c5':'#ff8b73','center');text(g.reason+'  ·  '+g.difficultyInfo.name,480,151,16,'#d4d6c5','center');box(235,187,490,190);text('耗时',270,219,15,'#9eb7aa');text(g.used.toFixed(1)+' 秒',685,219,17,'#f5e5c6','right');text('被发现次数',270,255,15,'#9eb7aa');text(String(g.detections),685,255,17,'#f5e5c6','right');text('评级',270,291,15,'#9eb7aa');text(g.rating,685,291,28,'#f4b76e','right');let best=bestRead(g.difficulty);text('最佳通关',270,337,15,'#9eb7aa');text(best?best.toFixed(1)+' 秒':'暂无',685,337,17,'#f5e5c6','right');text(g.win?'你逃了出来。下次试着更快、更安静。':`本次拿到 ${g.found} / 3 张密钥卡 · 再试一次，找到另一条路。`,480,393,12,'#b8a69b','center');button('再试一次',275,410,190,44,()=>start(),{primary:true});button('返回菜单',495,410,190,44,()=>{screen='menu';help=false})}
function render(){buttons=[];if(screen==='menu')drawMenu();else if(screen==='result')drawResult();else{drawWorld(game);drawLighting(game);drawHUD(game)}}
function tick(now){if(!last)last=now;let delta=Math.min(.1,(now-last)/1000);last=now;updateAmbient(delta);acc+=delta;while(acc>=1/CONFIG.fps){if(screen==='play'&&!game.paused)updateGame(1/CONFIG.fps);else if(screen==='menu')menuTime+=1/CONFIG.fps;acc-=1/CONFIG.fps}render();requestAnimationFrame(tick)}
function pointerPos(e){let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*540/r.height}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.focus();let p=pointerPos(e);if(screen==='play'&&!game.paused&&p.x<195&&p.y>300&&p.y<465&&touch.id===null){touch.id=e.pointerId;canvas.setPointerCapture(e.pointerId);touch.x=clamp((p.x-102)/45,-1,1);touch.y=clamp((p.y-376)/45,-1,1);return}for(const b of buttons.slice().reverse())if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){if(b.hold){touch[b.hold]=true;pointerActions.set(e.pointerId,b.hold);canvas.setPointerCapture(e.pointerId)}else b.action();break}});
canvas.addEventListener('pointermove',e=>{if(e.pointerId===touch.id){let p=pointerPos(e);touch.x=clamp((p.x-102)/45,-1,1);touch.y=clamp((p.y-376)/45,-1,1)}});
function pointerRelease(e){if(e.pointerId===touch.id){touch.id=null;touch.x=touch.y=0}let action=pointerActions.get(e.pointerId);if(action){touch[action]=false;pointerActions.delete(e.pointerId)}}canvas.addEventListener('pointerup',pointerRelease);canvas.addEventListener('pointercancel',pointerRelease);canvas.addEventListener('lostpointercapture',pointerRelease);
window.addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Shift'].includes(k))e.preventDefault();if(!keys[k]&&screen==='play'){if(k==='e'&&!game.paused)interact();if(k===' '&&!game.paused)decoy();if(k==='p')game.paused=!game.paused;if(k==='m')muted=!muted}keys[k]=true});window.addEventListener('keyup',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});window.addEventListener('blur',()=>{keys={};touch.id=null;touch.x=touch.y=0;touch.sprint=false;pointerActions.clear();if(screen==='play')game.paused=true});
requestAnimationFrame(tick);
</script>
