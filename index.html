航行次数是信件时限，超时信件退回；燃料耗尽可以缓慢漂流，抵达后自动补满。

{id:2,name:'沙漏星',x:440,y:105,color:'#efb579',resident:'时间商人',intro:['欢迎，旅人。我收集散落的时间。','别担心，在这里不必匆忙。','这封信似乎有一粒温暖的沙。'],puzzles:[['时间送给耐心的人什么？',['一朵花开的瞬间','更快的钟','空空的沙漏'],0],['一粒沙落下，也值得被____。',['珍惜','遗忘','追赶'],0],['最好的礼物有时是一起度过的____。',['时光','价格','距离'],0]]},

const ROUTES=[[0,1,1],[0,3,1],[1,2,1],[1,3,1],[2,4,1],[3,4,1],[3,5,1],[4,5,1],[4,6,1],[5,6,1]];

let STATE,scene='menu',selected=null,buttons=[],flight=null,dialog=null,endingType='',paused=false,muted=false,help=false,notice='',noticeTime=0,clock=0,keys={},touch={id:null,x:0,y:0},audio=null,last=0,acc=0;
function fresh(){return {dust:0,upgrades:{fuel:0,cargo:0,engine:0,shield:0},affinity:[0,0,0,0,0,0,0],gifts:{},bag:[],orders:[],completed:0,location:0,visited:{},moon:false,endingAt:0,seed:CONFIG.seed,serial:0};}
function save(){try{localStorage.setItem(CONFIG.saveKey,JSON.stringify(STATE))}catch(e){say('无法保存：浏览器存储不可用')}}
function load(){try{let s=JSON.parse(localStorage.getItem(CONFIG.saveKey));if(!s||!Array.isArray(s.bag)||!Array.isArray(s.affinity)||!s.upgrades)throw 0;return Object.assign(fresh(),s)}catch(e){return fresh()}}
function hasSave(){try{return !!localStorage.getItem(CONFIG.saveKey)}catch(e){return false}}
function rand(){STATE.seed=(Math.imul(STATE.seed,1664525)+1013904223)>>>0;return STATE.seed/4294967296}
function pick(a){return a[Math.floor(rand()*a.length)]}function totalAffinity(){return STATE.affinity.slice(1,6).reduce((a,b)=>a+b,0)}function maxFuel(){return CONFIG.fuel+15*STATE.upgrades.fuel+Object.keys(STATE.gifts).filter(k=>k.endsWith('-5')).length*10}function capacity(){return CONFIG.cargo+STATE.upgrades.cargo}function deliveryBonus(){return Object.keys(STATE.gifts).filter(k=>k.endsWith('-10')).length*2}function sound(type='click'){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;let f={click:460,pick:720,hit:110,buy:600,shield:350,win:520}[type]||460;o.type=type==='hit'?'sawtooth':'square';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(type==='hit'?60:f*1.5,t+.12);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.17)}catch(e){}}
function say(t){notice=t;noticeTime=3}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function line(x1,y1,x2,y2,c='#52658a',w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function text(s,x,y,size=16,c='#fff5dc',align='left'){ctx.fillStyle=c;ctx.font=`${size}px ui-monospace, monospace`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y)}function wrap(s,x,y,max,size=16,color='#fff5dc',spacing=25){let row='',yy=y;for(const ch of s){if(ctx.measureText(row+ch).width>max&&row){text(row,x,yy,size,color);row='';yy+=spacing}row+=ch}if(row)text(row,x,yy,size,color);return yy}
function panel(x,y,w,h){rect(x,y,w,h,'#111939ee');rect(x,y,w,2,'#7698aa');rect(x,y+h-2,w,2,'#334268');rect(x,y,2,h,'#7698aa');rect(x+w-2,y,2,h,'#334268')}
function button(label,x,y,w,h,fn,disabled=false,accent=false){rect(x,y,w,h,disabled?'#242a3c':accent?'#e5c477':'#263b58');rect(x,y,w,2,disabled?'#424656':accent?'#fff0b8':'#789bad');rect(x,y+h-3,w,3,disabled?'#181c2a':accent?'#a97746':'#101d35');text(label,x+w/2,y+h/2,15,disabled?'#777d89':accent?'#1b2440':'#f8f0dd','center');if(!disabled)buttons.push({x,y,w,h,fn})}
function stars(offset=0){let grad=ctx.createLinearGradient(0,0,960,540);grad.addColorStop(0,'#0b1030');grad.addColorStop(1,'#2a1b5d');rect(0,0,960,540,grad);for(let l=0;l<3;l++)for(let i=0;i<45;i++){let x=((i*193+l*71+Math.sin(i*91)*130-offset*(l+1)*.12)%970+970)%970,y=(i*113+l*97+31)%540;rect(Math.floor(x),y,l===2?3:2,l===2?3:2,['#37456c','#69769b','#d1c8be'][l])}}
function planetArt(x,y,r,id){const p=PLANETS[id];circle(x,y,r,p.color);circle(x-r*.22,y-r*.25,r*.23,'#ffffff33');circle(x+r*.25,y+r*.24,r*.15,'#24204c33');if(id===1){rect(x-r*.16,y-r*.45,r*.22,r*.55,'#fff0c6');rect(x-r*.25,y-r*.52,r*.4,r*.12,'#e78d76')}if(id===2){rect(x-r*.28,y-r*.25,r*.56,r*.1,'#ffe8b6');rect(x-r*.19,y-r*.16,r*.38,r*.32,'#e5a867')}if(id===3){circle(x,y-r*.06,r*.35,'#fff0d4');rect(x-r*.4,y-r*.19,r*.8,r*.18,'#cf709d');rect(x-r*.11,y,r*.22,r*.3,'#fff0d4')}if(id===4){rect(x-r*.25,y-r*.22,r*.5,r*.37,'#4e9ba8');rect(x-r*.12,y-r*.12,r*.07,r*.07,'#fff7c2');rect(x+r*.06,y-r*.12,r*.07,r*.07,'#fff7c2')}if(id===5){circle(x,y,r*.25,'#fff8ec');circle(x,y-r*.25,r*.17,'#fff8ec');rect(x-r*.16,y-r*.1,r*.32,r*.06,'#ed8b80')}if(id===6){rect(x-r*.3,y-r*.15,r*.6,r*.35,'#faf2de');line(x-r*.3,y-r*.15,x,y+r*.08,'#b792b0',2);line(x+r*.3,y-r*.15,x,y+r*.08,'#b792b0',2)}}
function ship(x,y,boost=false){rect(x-21,y-6,30,12,'#e8e1cf');rect(x-11,y-13,20,26,'#d9d4ca');rect(x+9,y-6,8,12,'#f5c875');rect(x-5,y-7,10,14,'#58c9dd');rect(x-17,y-17,10,5,'#ed8d79');rect(x-17,y+12,10,5,'#ed8d79');rect(x-29,y-4,8,8,boost?'#fff2a2':'#f38f60');rect(x-12,y-3,4,6,'#273a5e');rect(x+3,y-5,3,10,'#a1f2ee');rect(x-22,y-8,5,16,'#efb18b')}
// 飞行奖励：短暂的星尘连击、擦肩而过、星环和无伤抵达。
function spark(x,y,color,count=9){if(!flight)return;for(let i=0;i<count;i++){let a=rand()*Math.PI*2,v=35+rand()*110;flight.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.3+rand()*.5,color})}}
function pop(x,y,label,color='#ffe7a4'){if(flight)flight.labels.push({x,y,label,color,life:1.2})}
function collectDust(f,o){f.combo=f.comboTimer>0?f.combo+1:1;f.comboTimer=CONFIG.difficulty.comboWindow;let n=f.combo%5===0?3:1;STATE.dust+=n;f.collected++;spark(o.x,o.y,'#ffe289',6);pop(o.x,o.y,n>1?'连击 +3':'+1');sound('pick')}
function flightExtras(f,dt){
  f.comboTimer=Math.max(0,f.comboTimer-dt);if(!f.comboTimer)f.combo=0;
  f.trailTimer-=dt;f.ringTimer-=dt;f.waveTimer-=dt;
  if(f.trailTimer<=0){f.trailTimer=CONFIG.difficulty.trailInterval;let y=f.firstTrail?270:115+rand()*300,curve=rand()>.5?1:-1,start=f.firstTrail?540:990;f.firstTrail=false;for(let i=0;i<6;i++)f.objects.push({type:'dust',x:start+i*42,y:y+Math.sin(i*.65)*42*curve,r:9,vx:-155,vy:0})}
  if(f.waveTimer<=0){f.waveTimer=7;let gap=145+rand()*250;for(let i=0;i<3;i++){let y=105+i*145;if(Math.abs(y-gap)<75)continue;f.objects.push({type:'rock',x:1020+i*26,y,r:18,vx:-170,vy:0})}pop(700,95,'陨石阵来袭 · 寻找缺口','#ffb9a9')}
  if(f.ringTimer<=0){f.ringTimer=CONFIG.difficulty.ringInterval;let y=125+rand()*270;f.objects.push({type:'ring',x:1000,y,r:32,vx:-140,vy:0});for(let i=0;i<2;i++)f.objects.push({type:'rock',x:1000+(i?35:-35),y:Math.max(84,Math.min(450,y+(i?82:-82))),r:14,vx:-140,vy:0})}
  if(rand()<dt*(f.boost?30:12)){f.particles.push({x:f.x-26,y:f.y+(rand()-.5)*8,vx:-90-rand()*75,vy:(rand()-.5)*18,life:.25+rand()*.22,color:f.boost?'#ffe88f':'#fa9770'})}
  for(const p of f.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}f.particles=f.particles.filter(p=>p.life>0).slice(-180);
  for(const l of f.labels){l.y-=25*dt;l.life-=dt}f.labels=f.labels.filter(l=>l.life>0);
  f.flash=Math.max(0,f.flash-dt);
}
function refreshOrders(){STATE.orders=[];for(let i=0;i<3;i++){let p=PLANETS[1+Math.floor(rand()*5)],q=getPuzzle(null,p);STATE.orders.push({id:++STATE.serial,to:p.id,reward:14+Math.floor(rand()*9),deadline:5+Math.floor(rand()*3),content:q[0],puzzle:p.puzzles.indexOf(q)})}save()}
function route(a,b){return ROUTES.find(r=>(r[0]===a&&r[1]===b)||(r[1]===a&&r[0]===b))}
function switchScene(next,data){if(scenes[scene])scenes[scene].exit();scene=next;buttons=[];paused=false;scenes[next].enter(data)}
function completeTrip(){if(!flight.hits){STATE.dust+=CONFIG.difficulty.perfectBonus;say('完美航行！无伤奖励 ✦ +'+CONFIG.difficulty.perfectBonus)}else if(flight.nearCount)say('平安抵达！惊险擦肩 '+flight.nearCount+' 次');STATE.location=flight.to;STATE.bag.forEach(o=>o.deadline--);let expired=STATE.bag.filter(o=>o.deadline<0);STATE.bag=STATE.bag.filter(o=>o.deadline>=0);if(expired.length)say(`${expired.length} 封信超时，已退回邮局`);save();if(STATE.location===6&&!STATE.moon){switchScene('dialogue',{moon:true});return}let letter=STATE.bag.find(o=>o.to===STATE.location);if(letter){switchScene('dialogue',{letter});return}if(flight.hits&&!flight.nearCount)say('平安抵达，燃料已补满');switchScene('map')}
function failTrip(){STATE.bag=[];STATE.location=0;STATE.dust=Math.max(0,STATE.dust-10);save();say('飞船受损！信件丢失，返回邮局，星尘 −10');switchScene('map')}
function beginFlight(){let r=route(STATE.location,selected);if(!r)return;switchScene('flight',{to:selected,distance:r[2]})}
function getPuzzle(letter,planet){if(letter&&letter.puzzle!=null)return planet.puzzles[letter.puzzle];let used=STATE.visited[planet.id]||[];let available=planet.puzzles.map((_,i)=>i).filter(i=>!used.includes(i));if(!available.length){used=[];available=planet.puzzles.map((_,i)=>i)}let idx=pick(available);used.push(idx);STATE.visited[planet.id]=used;return planet.puzzles[idx]}
function startDialogue(data){let p=PLANETS[STATE.location],letter=data.letter,q=getPuzzle(letter,p);let answers=q[1].map((label,i)=>({label,correct:i===q[2]}));for(let i=answers.length-1;i>0;i--){let j=Math.floor(rand()*(i+1));[answers[i],answers[j]]=[answers[j],answers[i]]}q=[q[0],answers.map(a=>a.label),answers.findIndex(a=>a.correct)];dialog={planet:p,letter,moon:!!data.moon,lines:p.intro.slice(),index:0,chars:0,q,phase:'intro',result:'',newGifts:[]};if(STATE.affinity[p.id]>=10)dialog.lines.push('你是这里最珍贵的朋友，我们会一直记得你。');else if(STATE.affinity[p.id]>=5)dialog.lines.push('你又来了，这里已经为你留了一盏灯。');if(data.moon){const words=['每一位','需要','温暖','的','人'];let clues=words.map((w,i)=>STATE.gifts[(i+1)+'-5']?w:'？');dialog.lines.push('五份礼物拼出的收件人：'+clues.join(' ')+'。');if(clues.includes('？')){dialog.lines.push('还有线索在路上。把信送给各星球，等好感达到 5 再回来吧。');dialog.missing=true}}}
function answer(i){let good=i===dialog.q[2],p=dialog.planet;if(dialog.moon){if(good){STATE.moon=true;dialog.result='信封亮了起来：收件人是每一位需要温暖的人。月信箱完成！'}else{dialog.result='月光轻声说：想想那些礼物，都是为了把温暖送给谁。请再试一次。';dialog.phase='retry';sound('click');return}}else{let old=STATE.affinity[p.id];STATE.affinity[p.id]=Math.min(CONFIG.maxAffinity,old+(good?2:1));let reward=Math.round(dialog.letter.reward*(good?1.5:1))+deliveryBonus();STATE.dust+=reward;STATE.completed++;STATE.bag=STATE.bag.filter(o=>o.id!==dialog.letter.id);dialog.result=(good?'答对了！':'没关系，'+p.resident+'轻声提示：'+dialog.q[1][dialog.q[2]]+'。')+` 好感 +${STATE.affinity[p.id]-old}，星尘 +${reward}。`;for(let level of [5,10])if(old<level&&STATE.affinity[p.id]>=level){STATE.gifts[p.id+'-'+level]=true;dialog.newGifts.push(level===5?'燃料上限 +10，收件人线索一片':'永久送信报酬 +2')}if(dialog.newGifts.length)dialog.result+=' 收到礼物：'+dialog.newGifts.join('，')+'。';if(totalAffinity()>=12&&totalAffinity()-(STATE.affinity[p.id]-old)<12)dialog.result+=' 月信箱出现在星图上！'}dialog.phase='result';dialog.chars=0;sound('win');save()}
function finishDialogue(){let more=STATE.bag.find(o=>o.to===STATE.location);if(more){switchScene('dialogue',{letter:more});return}if(STATE.completed>=10&&(STATE.endingAt===0||(STATE.moon&&totalAffinity()>=40&&STATE.endingAt<2))){endingType=totalAffinity()>=40&&STATE.moon?'银河':totalAffinity()>=20?'温暖':'平凡';STATE.endingAt=endingType==='银河'?2:1;save();switchScene('ending');return}switchScene('map')}
